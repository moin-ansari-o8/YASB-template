# YASB Theme Configuration
# Switch between themes by changing cur_theme value
# After changing, run: python switch_theme.py <theme-name>

cur_theme: "snow-light"  # Options: "golden-light", "snow-light", or your custom theme

themes:
  golden-light:
    # Primary colors - warm golden tones
    primary: "#b8956a"           # Main accent gold
    primary_dim: "#8b6f47"       # Dimmer gold
    primary_hover: "#c9a66b"     # Hover gold
    # Text colors
    text_primary: "#d4c5b0"      # Main text - off white
    text_secondary: "#9b8b7e"    # Secondary text - muted brown
    text_tertiary: "#8b7355"     # Tertiary text - darker brown
    # Background colors
    bg_primary: "rgba(35, 28, 24, 0.6)"      # Main bar background
    bg_secondary: "rgba(45, 36, 30, 0.75)"   # Popup backgrounds
    bg_tertiary: "rgba(30, 24, 20, 0.5)"     # Card backgrounds
    bg_hover: "rgba(50, 40, 32, 0.6)"        # Hover state
    bg_button_hover: "rgb(65, 52, 42)"       # Button hover
    # Border colors
    border_primary: "#3d3228"    # Main borders
    border_secondary: "#4a3f35"  # Secondary borders
    # Special colors
    accent_warm: "#c17a5c"       # Warm accent (power menu)
    
  snow-light:
    # Primary colors - cool white/snow tones
    primary: "rgb(22, 22, 20)"           # Cooler blue accent
    primary_dim: "rgb(22, 22, 20)"       # Dimmer blue
    primary_hover: "rgb(22, 22, 20)"     # Hover blue
    # Text colors - white snow variants
    text_primary: "rgb(22, 22, 20)"      # Snow white with slight blue tint
    text_secondary: "rgb(22, 22, 20)"    # Medium snow white
    text_tertiary: "rgb(22, 22, 20)"     # Darker snow white
    # Background colors - very transparent with blur
    bg_primary: "rgba(207, 197, 187, 0.95)"     # Main bar - updated rgb(207, 197, 187)
    bg_secondary: "rgba(230, 220, 210, 0.95)"   # Popup backgrounds - much lighter/opaque now
    bg_tertiary: "rgba(245, 250, 255, 0.2)"     # Card backgrounds
    bg_hover: "rgba(230, 240, 250, 0.3)"        # Hover state
    bg_button_hover: "rgba(220, 235, 245, 0.4)" # Button hover
    # Border colors
    border_primary: "rgb(180, 170, 160)"    # Subtle borders (darker than bg)
    border_secondary: "rgb(190, 180, 170)"  # Lighter borders
    # Special colors
    accent_warm: "#88a8c8"       # Cool accent (power menu)
